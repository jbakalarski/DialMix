name: Build and draft release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: dotnet publish src/DialMix/DialMix.csproj -c Release -o artifacts/DialMix
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path dist/DialMix.streamDeckPlugin)) { throw 'DialMix.streamDeckPlugin was not generated' }
      - name: Generate release notes
        shell: pwsh
        run: |
          $previous = git describe --tags --abbrev=0 2>$null
          $logFormat = '%s%x1f%b%x1e'
          if ($previous) {
            $rawCommits = @(git log "$previous..HEAD" --pretty=format:$logFormat) -join "`n"
          } else {
            $rawCommits = @(git log --pretty=format:$logFormat) -join "`n"
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          foreach ($record in ($rawCommits -split [char]0x1e)) {
            if ([string]::IsNullOrWhiteSpace($record)) { continue }
            $fields = $record -split [char]0x1f, 2
            $title = $fields[0].Trim()
            if ([string]::IsNullOrWhiteSpace($title)) { continue }
            $notes.Add("- **$title**")

            $description = @()
            if ($fields.Count -gt 1) {
              $description = $fields[1].Trim() -split "`r?`n" |
                Where-Object { $_.Trim() -and $_ -notmatch '^Co-Authored-By:' }
            }
            if ($description.Count -eq 0) { $description = @('No additional description provided.') }
            foreach ($line in $description) { $notes.Add("  - $($line.Trim().TrimStart('-').Trim())") }
            $notes.Add('')
          }
          if ($notes.Count -eq 0) {
            $notes.Add('- **Initial DialMix build**')
            $notes.Add('  - No additional description provided.')
          }

          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          @("# DialMix Development Build — $date", '', '## Changes', '', $notes) |
            Out-File release-notes.md -Encoding utf8
          "RELEASE_NAME=DialMix Development Build — $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          draft: true
          files: dist/DialMix.streamDeckPlugin
