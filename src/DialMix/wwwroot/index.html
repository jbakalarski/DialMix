<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DialMix</title><style>body{margin:0;background:#101217;color:#eef1f7;font:15px system-ui}main{max-width:920px;margin:0 auto;padding:36px 22px}h1{font-size:32px;margin:0}.sub{color:#8d96a8;margin:6px 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#1a1e27;border:1px solid #2d3442;border-radius:14px;padding:18px}.name{font-size:17px;font-weight:650}.type{color:#8993a6;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.volume{font-size:36px;margin:18px 0 8px}.bar{height:7px;background:#303746;border-radius:6px;overflow:hidden}.fill{height:100%;background:#6d8cff}.mute{color:#ff8b9e}.refresh{float:right;background:#29334e;color:white;border:0;padding:8px 13px;border-radius:8px;cursor:pointer}</style></head><body><main><button class="refresh" onclick="load()">Refresh</button><h1>DialMix</h1><div class="sub">Windows Core Audio control center</div><section class="grid" id="targets"></section></main><script>async function load(){const xs=await fetch('/api/audio/targets').then(r=>r.json());document.querySelector('#targets').innerHTML=xs.map(x=>`<article class="card"><div class="type">${x.type}</div><div class="name">${x.name}</div><div class="volume ${x.muted?'mute':''}">${x.muted?'Muted':Math.round(x.volume*100)+'%'}</div><div class="bar"><div class="fill" style="width:${x.volume*100}%"></div></div></article>`).join('')}load();setInterval(load,2000)</script></body></html>
