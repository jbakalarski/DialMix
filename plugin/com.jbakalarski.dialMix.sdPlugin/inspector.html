<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body { font: 13px system-ui, sans-serif; color: #eee; background: #252525; padding: 12px; }
    label { display: block; margin: 9px 0 4px; color: #bbb; }
    select, input[type=number], input[type=text] { width: 100%; box-sizing: border-box; padding: 7px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
    fieldset { border: 1px solid #4b4b4b; border-radius: 5px; margin: 14px 0 0; padding: 8px 10px 10px; }
    legend { color: #ddd; padding: 0 4px; }
    .check { display: flex; align-items: center; gap: 8px; margin: 7px 0; color: #eee; }
    .check input { accent-color: #fff; }
    .color { display: grid; grid-template-columns: 1fr 72px; gap: 8px; align-items: center; }
    input[type=color] { width: 100%; height: 30px; padding: 1px; background: #333; border: 1px solid #555; border-radius: 4px; }
    textarea { width: 100%; min-height: 74px; box-sizing: border-box; padding: 7px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; font: 12px monospace; resize: vertical; }
    #targetStatus { min-height: 18px; margin-top: 5px; color: #aaa; font-size: 12px; }
    #targetStatus.error { color: #ff9a9a; }
    #updateStatus { min-height: 18px; margin-top: 8px; color: #a9d6ff; font-size: 12px; }
    #updateStatus a { color: inherit; }
  </style>
</head>
<body>
  <label for="target">Audio target</label>
  <select id="target"></select>
  <div id="targetStatus" role="status">Loading audio targets…</div>
  <div id="updateStatus" role="status"></div>
  <label for="targetName">Custom target name (optional)</label>
  <input id="targetName" type="text" maxlength="80" placeholder="Use the audio target name">
  <label for="step">Step (%)</label>
  <input id="step" type="number" min="1" max="100" value="5">
  <label for="press">Press action</label>
  <select id="press"><option value="toggleMute">Toggle mute</option><option value="none">None</option></select>
  <fieldset><legend>Displayed elements</legend>
    <label class="check"><input id="showIcon" type="checkbox" checked> Icon</label>
    <label class="check"><input id="autoApplicationIcon" type="checkbox" checked> Automatically load application icon</label>
    <label for="iconFile">Choose custom icon file</label>
    <input id="iconFile" type="file" accept=".svg,.png,image/svg+xml,image/png">
    <label for="customIcon">Custom icon (SVG or data URL, optional)</label>
    <textarea id="customIcon" placeholder="Paste an SVG or data:image/... URL"></textarea>
    <label class="check"><input id="showSource" type="checkbox" checked> Source name</label>
    <label class="check"><input id="showVolume" type="checkbox" checked> Volume percentage</label>
    <label class="check"><input id="showBar" type="checkbox" checked> Volume bar</label>
  </fieldset>
  <fieldset><legend>Colors</legend>
    <label>Icon <span class="color"><input id="iconColor" type="text" value="#FFFFFF"><input id="iconColorPicker" type="color" value="#FFFFFF"></span></label>
    <label>Source name <span class="color"><input id="sourceColor" type="text" value="#FFFFFF"><input id="sourceColorPicker" type="color" value="#FFFFFF"></span></label>
    <label>Volume <span class="color"><input id="volumeColor" type="text" value="#FFFFFF"><input id="volumeColorPicker" type="color" value="#FFFFFF"></span></label>
    <label>Bar fill <span class="color"><input id="barColor" type="text" value="#FFFFFF"><input id="barColorPicker" type="color" value="#FFFFFF"></span></label>
    <label>Bar track <span class="color"><input id="barBackgroundColor" type="text" value="#404040"><input id="barBackgroundColorPicker" type="color" value="#404040"></span></label>
    <label>Bar border <span class="color"><input id="barBorderColor" type="text" value="#FFFFFF"><input id="barBorderColorPicker" type="color" value="#FFFFFF"></span></label>
    <label>Background <span class="color"><input id="backgroundColor" type="text" value="#000000"><input id="backgroundColorPicker" type="color" value="#000000"></span></label>
  </fieldset>
  <script>
    const defaults = { targetId:'system', targetMatchName:'System volume', targetType:'System', targetName:'', step:5, pressAction:'toggleMute', showIcon:true, autoApplicationIcon:true, customIcon:'', showSource:true, showVolume:true, showBar:true, iconColor:'#FFFFFF', sourceColor:'#FFFFFF', volumeColor:'#FFFFFF', barColor:'#FFFFFF', barBackgroundColor:'#404040', barBorderColor:'#FFFFFF', backgroundColor:'#000000' };
    let socket = null;
    let context = null;
    let action = 'com.jbakalarski.dialMix.control';
    let selectedTargetId = defaults.targetId;
    let selectedTargetMatchName = defaults.targetMatchName;
    let selectedTargetType = defaults.targetType;
    const target = document.querySelector('#target');
    const targetStatus = document.querySelector('#targetStatus');
    const updateStatus = document.querySelector('#updateStatus');
    const fields = ['target','targetName','step','press','showIcon','autoApplicationIcon','customIcon','showSource','showVolume','showBar','iconColor','sourceColor','volumeColor','barColor','barBackgroundColor','barBorderColor','backgroundColor'];
    const value = id => document.querySelector(`#${id}`);
    function setColor(id, color) { value(id).value = color; value(`${id}Picker`).value = /^#[0-9a-f]{6}$/i.test(color) ? color : '#FFFFFF'; }
    function applySettings(raw) { const s = { ...defaults, ...(raw || {}) }; selectedTargetId = s.targetId || defaults.targetId; selectedTargetMatchName = s.targetMatchName || defaults.targetMatchName; selectedTargetType = s.targetType || defaults.targetType; if ([...target.options].some(option => option.value === selectedTargetId)) target.value = selectedTargetId; value('targetName').value = s.targetName || ''; value('step').value = s.step; value('press').value = s.pressAction; value('customIcon').value = s.customIcon || ''; ['showIcon','autoApplicationIcon','showSource','showVolume','showBar'].forEach(id => value(id).checked = s[id] !== false); ['iconColor','sourceColor','volumeColor','barColor','barBackgroundColor','barBorderColor','backgroundColor'].forEach(id => setColor(id, s[id] || defaults[id])); }
    function currentSettings() { const option = target.selectedOptions[0]; const s = { targetId:target.value || selectedTargetId, targetMatchName:option?.dataset.name || defaults.targetMatchName, targetType:option?.dataset.type || defaults.targetType, targetName:value('targetName').value.trim(), step:Math.max(1, Math.min(100, Number(value('step').value) || 5)), pressAction:value('press').value, customIcon:value('customIcon').value.trim() }; ['showIcon','autoApplicationIcon','showSource','showVolume','showBar'].forEach(id => s[id] = value(id).checked); ['iconColor','sourceColor','volumeColor','barColor','barBackgroundColor','barBorderColor','backgroundColor'].forEach(id => s[id] = value(id).value.toUpperCase()); return s; }
    function save() { if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify({ event:'sendToPlugin', action, context, payload:currentSettings() })); }
    function readIconFile(file) { return new Promise((resolve, reject) => { if (!['image/svg+xml', 'image/png'].includes(file.type) && !/\.(svg|png)$/i.test(file.name)) { reject(new Error('Choose an SVG or PNG file.')); return; } const reader = new FileReader(); reader.addEventListener('load', () => resolve(String(reader.result || ''))); reader.addEventListener('error', () => reject(new Error('Unable to read the icon file.'))); reader.readAsDataURL(file); }); }
    function applyTargets(targets) { const selected = target.value || selectedTargetId; target.replaceChildren(); (targets || []).forEach(x => { const option = new Option(`${x.type}: ${x.name}`, x.id); option.dataset.name = x.name; option.dataset.type = x.type; target.add(option); }); if ([...target.options].some(option => option.value === selected)) target.value = selected; else { const fallback = [...target.options].find(option => option.dataset.name === selectedTargetMatchName && option.dataset.type === selectedTargetType); if (fallback) target.value = fallback.value; } }
    function showTargetStatus(message, isError = false) { targetStatus.textContent = message; targetStatus.classList.toggle('error', isError); }
    function applyUpdateInfo(update) { if (!update?.available) { updateStatus.textContent = ''; return; } updateStatus.innerHTML = `New DialMix version ${update.version} is available. <a href="${update.url}" target="_blank" rel="noopener">Open release</a>`; }
    async function loadTargets() { showTargetStatus('Loading audio targets…'); for (let attempt = 0; attempt < 20; attempt += 1) { try { const response = await fetch('http://127.0.0.1:17842/api/audio/targets'); if (!response.ok) throw new Error(`HTTP ${response.status}`); const targets = await response.json(); applyTargets(targets); showTargetStatus(`${targets.length} audio targets available.`); return; } catch (error) { if (attempt === 19) { showTargetStatus(`Unable to load audio targets: ${error.message}`, true); return; } await new Promise(resolve => setTimeout(resolve, 250)); } } }
    function handleMessage(event) { const message = JSON.parse(event.data); if (message.event === 'didReceiveSettings') applySettings(message.payload?.settings); if (message.event === 'sendToPropertyInspector') { const data = message.payload || {}; if (data.settings) applySettings(data.settings); if (Array.isArray(data.targets)) applyTargets(data.targets); if (data.update) applyUpdateInfo(data.update); } }
    function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
      const actionInfo = typeof inActionInfo === 'string' ? JSON.parse(inActionInfo) : (inActionInfo || {});
      context = actionInfo.context || context;
      action = actionInfo.action || action;
      applySettings(actionInfo.payload?.settings);
      socket = new WebSocket(`ws://127.0.0.1:${inPort}`);
      socket.addEventListener('open', () => {
        socket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
        socket.send(JSON.stringify({ event:'getSettings', action, context }));
        loadTargets();
      });
      socket.addEventListener('message', handleMessage);
    }
    window.connectOpenActionSocket = connectElgatoStreamDeckSocket;
    window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;
    loadTargets();
    fields.forEach(id => value(id).addEventListener('change', () => { if (id === 'target') selectedTargetId = target.value; save(); }));
    value('iconFile').addEventListener('change', async () => { const file = value('iconFile').files[0]; if (!file) return; try { value('customIcon').value = await readIconFile(file); save(); showTargetStatus(`Custom icon loaded: ${file.name}`); } catch (error) { showTargetStatus(error.message, true); } });
    value('customIcon').addEventListener('input', save);
    ['iconColor','sourceColor','volumeColor','barColor','barBackgroundColor','barBorderColor','backgroundColor'].forEach(id => value(`${id}Picker`).addEventListener('input', event => { setColor(id, event.target.value); save(); }));
  </script>
</body>
</html>
