<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;color:#eee;background:#252525;padding:14px}label{display:block;margin:10px 0 4px}select,input{width:100%;box-sizing:border-box;padding:7px;background:#333;color:#fff;border:1px solid #555;border-radius:4px}</style></head><body><label>Audio target</label><select id="target"></select><label>Step (%)</label><input id="step" type="number" min="1" max="100" value="5"><label>Press action</label><select id="press"><option value="toggleMute">Toggle mute</option><option value="none">None</option></select><script>
const qs=new URLSearchParams(location.search);const socket=new WebSocket(`ws://${qs.get('port')||location.host}`);let context=qs.get('context');const target=document.querySelector('#target');const step=document.querySelector('#step');const press=document.querySelector('#press');socket.onopen=()=>socket.send(JSON.stringify({event:'getSettings',context}));socket.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==='sendToPropertyInspector'){for(const x of m.payload.targets||[])target.add(new Option(`${x.type}: ${x.name}`,x.id));}};fetch('http://127.0.0.1:17842/api/audio/targets').then(r=>r.json()).then(xs=>{xs.forEach(x=>target.add(new Option(`${x.type}: ${x.name}`,x.id)));});function save(){socket.send(JSON.stringify({event:'setSettings',context,payload:{targetId:target.value,step:Number(step.value),pressAction:press.value}}));}target.onchange=save;step.onchange=save;press.onchange=save;
</script></body></html>
